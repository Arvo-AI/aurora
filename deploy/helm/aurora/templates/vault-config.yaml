{{- if .Values.services.vault.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aurora.fullname" . }}-vault-config
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
data:
  vault.hcl: |
    disable_mlock = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    api_addr = "http://{{ include "aurora.fullname" . }}-vault:8200"
    log_level = "info"

    {{- if and .Values.vault.seal (eq .Values.vault.seal.type "gcpckms") }}
    seal "gcpckms" {
      project    = "{{ .Values.vault.seal.gcpckms.project }}"
      region     = "{{ .Values.vault.seal.gcpckms.region }}"
      key_ring   = "{{ .Values.vault.seal.gcpckms.key_ring }}"
      crypto_key = "{{ .Values.vault.seal.gcpckms.crypto_key }}"
      {{- if .Values.vault.seal.gcpckms.credentials }}
      credentials = "{{ .Values.vault.seal.gcpckms.credentials }}"
      {{- end }}
    }
    {{- end }}

    {{- if and .Values.vault.seal (eq .Values.vault.seal.type "awskms") }}
    seal "awskms" {
      region     = "{{ .Values.vault.seal.awskms.region }}"
      kms_key_id = "{{ .Values.vault.seal.awskms.kms_key_id }}"
      {{- if .Values.vault.seal.awskms.credentials }}
      access_key = "file:///vault/aws/access_key"
      secret_key = "file:///vault/aws/secret_key"
      {{- end }}
      {{- if .Values.vault.seal.awskms.endpoint }}
      endpoint   = "{{ .Values.vault.seal.awskms.endpoint }}"
      {{- end }}
    }
    {{- end }}

    {{- if and .Values.vault.seal (eq .Values.vault.seal.type "azurekeyvault") }}
    {{- $akv := .Values.vault.seal.azurekeyvault | default dict }}
    seal "azurekeyvault" {
      tenant_id  = "{{ required "vault.seal.azurekeyvault.tenant_id is required" $akv.tenant_id }}"
      vault_name = "{{ required "vault.seal.azurekeyvault.vault_name is required" $akv.vault_name }}"
      key_name   = "{{ required "vault.seal.azurekeyvault.key_name is required" $akv.key_name }}"
      {{- if $akv.environment }}
      environment = "{{ $akv.environment }}"
      {{- end }}
    }
    {{- end }}
{{- end }}
