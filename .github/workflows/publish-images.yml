name: Publish Docker Images

# Trigger on:
#   - Git tag v*.*.* → tags as :1.2.3, :1.2, and :latest
#   - Push to main  → tags as :edge and :sha-<short>
#   - Manual trigger (workflow_dispatch) for hotfixes
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    if: github.repository == 'Arvo-AI/aurora'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: ./server
            dockerfile: ./server/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: server
            context: ./server
            dockerfile: ./server/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            context: ./client
            dockerfile: ./client/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - image: frontend
            context: ./client
            dockerfile: ./client/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/arvo-ai/aurora-${{ matrix.image }}

      - name: Build and push by digest (server)
        if: matrix.image == 'server'
        id: build-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/arvo-ai/aurora-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Build and push by digest (frontend)
        if: matrix.image == 'frontend'
        id: build-frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:5080
            NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:5006
            NEXT_PUBLIC_ENABLE_OVH=true
            NEXT_PUBLIC_ENABLE_PAGERDUTY_OAUTH=true
            NEXT_PUBLIC_ENABLE_SHAREPOINT=true
          outputs: type=image,name=ghcr.io/arvo-ai/aurora-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build-server.outputs.digest || steps.build-frontend.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "No digest produced by build step" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          # File name = arch, content = sha256:<hex>. Per-arch filenames let the
          # merge job validate that every expected arch is present *before*
          # calling `imagetools create`, so we never publish a half-populated
          # manifest list to the registry.
          printf '%s' "$DIGEST" > "/tmp/digests/${ARCH}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }} manifest
    needs: build
    if: github.repository == 'Arvo-AI/aurora'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, frontend]
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/arvo-ai/aurora-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ghcr.io/arvo-ai/aurora-${{ matrix.image }}
        run: |
          set -euo pipefail

          # Fail fast if any expected arch's digest is missing, *before* we
          # touch the registry. Keep this list in sync with the build matrix
          # (currently amd64 + arm64).
          expected_arches="amd64 arm64"
          missing=""
          for arch in $expected_arches; do
            if [ ! -s "$arch" ]; then
              missing="${missing} $arch"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing digest file(s) for arch(es):$missing" >&2
            echo "Contents of /tmp/digests:" >&2
            ls -la >&2
            exit 1
          fi

          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=""
          for arch in $expected_arches; do
            digest=$(cat "$arch")
            sources="${sources} ${IMAGE_NAME}@${digest}"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources

      - name: Inspect and verify multi-arch manifest
        run: |
          set -euo pipefail
          REF=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Inspecting $REF"
          docker buildx imagetools inspect "$REF"
          PLATFORMS=$(docker buildx imagetools inspect "$REF" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "Platforms: $PLATFORMS"
          echo "$PLATFORMS" | grep -q 'linux/amd64' || { echo "Missing linux/amd64 in manifest list"; exit 1; }
          echo "$PLATFORMS" | grep -q 'linux/arm64' || { echo "Missing linux/arm64 in manifest list"; exit 1; }

      # On tag releases, record the multi-arch manifest-list digest so the Helm
      # chart can pin images immutably (image.digests.<name>). This is the digest
      # clients should pin — it resolves per-arch automatically at pull time.
      - name: Capture manifest-list digest (tag releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ghcr.io/arvo-ai/aurora-${{ matrix.image }}
        run: |
          set -euo pipefail
          REF=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # --format '{{json .Manifest}}' exposes the index digest of the pushed ref.
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r '.digest')
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "Unexpected digest '$DIGEST' for $REF" >&2; exit 1 ;;
          esac
          echo "Manifest-list digest for ${IMAGE_NAME}: $DIGEST"
          mkdir -p /tmp/manifest-digests
          # File name = image name, content = sha256:<hex>
          printf '%s' "$DIGEST" > "/tmp/manifest-digests/${{ matrix.image }}"

      - name: Upload manifest digest artifact (tag releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manifest-digest-${{ matrix.image }}
          path: /tmp/manifest-digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Assemble a chart values overlay pinning each image by its manifest-list
  # digest, and attach it to the GitHub Release. Clients deploy reproducibly:
  #   helm upgrade --install aurora aurora/aurora-oss --version X.Y.Z \
  #     -f values.images-X.Y.Z.yaml
  # ===========================================================================
  image-digests:
    name: Publish image digest overlay
    needs: merge
    if: github.repository == 'Arvo-AI/aurora' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # attach asset to the release
    steps:
      - name: Download manifest digest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/manifest-digests
          pattern: manifest-digest-*
          merge-multiple: true

      - name: Build values overlay
        id: overlay
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Fail fast if either image's digest is missing.
          for img in server frontend; do
            if [ ! -s "/tmp/manifest-digests/${img}" ]; then
              echo "Missing manifest digest for '${img}'" >&2
              ls -la /tmp/manifest-digests >&2
              exit 1
            fi
          done
          SERVER_DIGEST=$(cat /tmp/manifest-digests/server)
          FRONTEND_DIGEST=$(cat /tmp/manifest-digests/frontend)
          OUT="values.images-${VERSION}.yaml"
          # NOTE: the whole `run: |` block is de-indented by YAML (the block scalar
          # strips the common 10-space indent), so bash sees the heredoc body AND the
          # closing `YAML` at column 0 — the terminator matches and the file is written
          # unindented. Keep every line here at the same indent; a stray extra indent on
          # the closing `YAML` would leave it un-matched and hang the parser.
          cat > "$OUT" <<YAML
          # Image digest pins for Aurora ${VERSION}.
          # Generated by CI on tag v${VERSION} — do not edit by hand.
          # Usage: helm upgrade --install aurora aurora/aurora-oss \\
          #          --version ${VERSION} -f ${OUT}
          image:
            registry: ghcr.io/arvo-ai
            digests:
              server: "${SERVER_DIGEST}"
              frontend: "${FRONTEND_DIGEST}"
          YAML
          echo "Generated $OUT:"
          cat "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Attach overlay to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh can't infer the repo from git —
          # set GH_REPO explicitly or `gh release` fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.overlay.outputs.file }}
        run: |
          set -euo pipefail
          # Release may not exist yet if this workflow wins the race with the
          # release-creating job; create it if needed, otherwise just upload.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Automated release $TAG"
          fi
          gh release upload "$TAG" "$FILE" --clobber

  publish-summary:
    name: Publish Summary
    runs-on: ubuntu-24.04
    needs: [build, merge, image-digests]
    if: always()
    permissions: {}
    steps:
      - name: Summary
        run: |
          echo "================================================"
          echo "Image Publish Summary"
          echo "================================================"
          echo ""
          echo "Build:         ${{ needs.build.result }}"
          echo "Merge:         ${{ needs.merge.result }}"
          echo "Image digests: ${{ needs.image-digests.result }}"
          echo ""
          # image-digests only runs on tag releases; 'skipped' is fine on main.
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.merge.result }}" != "success" ]; then
            echo "One or more publish stages failed!"
            exit 1
          fi
          if [ "${{ needs.image-digests.result }}" != "success" ] && [ "${{ needs.image-digests.result }}" != "skipped" ]; then
            echo "Image digest overlay publish failed!"
            exit 1
          fi
          echo "All multi-arch images published successfully"
