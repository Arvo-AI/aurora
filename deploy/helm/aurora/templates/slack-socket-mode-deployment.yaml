{{- /*
Slack Socket Mode listener deployment.

Only rendered when a Slack app-level token is configured
(config.SLACK_APP_TOKEN is non-empty). Socket Mode opens an OUTBOUND WebSocket
to Slack, so Slack events/interactions work without a public inbound webhook
URL — the intended path for private / self-hosted clusters that are not
reachable from the internet. Keep replicas at 1: each replica opens its own
socket and would double-process every event.
*/ -}}
{{- if .Values.config.SLACK_APP_TOKEN }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aurora.fullname" . }}-slack-socket-mode
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCounts.slackSocketMode }}
  # Only one socket at a time: recreate on update rather than briefly running two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aurora.name" . }}-slack-socket-mode
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.db.existingSecret }}
        checksum/secret-db: {{ include (print $.Template.BasePath "/secret-db.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.secrets.backend.existingSecret }}
        checksum/secret-backend: {{ include (print $.Template.BasePath "/secret-backend.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.secrets.app.existingSecret }}
        checksum/secret-app: {{ include (print $.Template.BasePath "/secret-app.yaml") . | sha256sum }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "aurora.name" . }}-slack-socket-mode
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aurora
    spec:
      serviceAccountName: {{ include "aurora.fullname" . }}-slack-socket-mode
      automountServiceAccountToken: false
      securityContext:
        {{- include "aurora.podSecurityContext" (dict "service" "slackSocketMode" "global" $ "defaults" (dict "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000)) | nindent 8 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      {{- include "aurora.scheduling" (dict "service" "slackSocketMode" "global" $) | nindent 6 }}
      containers:
        - name: slack-socket-mode
          image: {{ include "aurora.image" (dict "image" "server" "global" $) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.slack.socket_mode"]
          securityContext:
            {{- include "aurora.containerSecurityContext" (dict "service" "slackSocketMode" "global" $ "defaults" (dict)) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "aurora.fullname" . }}-config
            - secretRef:
                name: {{ include "aurora.secretName.db" . }}
            - secretRef:
                name: {{ include "aurora.secretName.backend" . }}
            - secretRef:
                name: {{ include "aurora.secretName.app" . }}
            - secretRef:
                name: {{ include "aurora.secretName.llm" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The listener holds an open socket for its whole lifetime; a live
          # process is the health signal. K8s restarts the container if it exits.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'services.slack.socket_mode' > /dev/null"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.slackSocketMode | nindent 12 }}
          {{- if .Values.ssl.caCertSecret }}
          volumeMounts:
            - name: ssl-ca-cert
              mountPath: {{ .Values.ssl.caCertMountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.ssl.caCertSecret }}
      volumes:
        - name: ssl-ca-cert
          secret:
            secretName: {{ .Values.ssl.caCertSecret }}
      {{- end }}
{{- end }}
