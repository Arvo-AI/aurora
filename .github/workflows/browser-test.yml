name: Aurora managed browser test

run-name: aurora-browser-${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id: { required: true, type: string }
      callback_token: { required: true, type: string }
      callback_url: { required: true, type: string }
      source_repo: { required: true, type: string }
      pr_number: { required: true, type: string }
      head_sha: { required: true, type: string }
      install_command: { required: true, type: string }
      start_command: { required: true, type: string }
      preview_port: { required: true, type: string }
      readiness_path: { required: true, type: string }
      readiness_timeout: { required: true, type: string }
      scenario_path: { required: true, type: string }
      scenario_hash: { required: true, type: string }
      model: { required: true, type: string }
      aurora_repo: { required: true, type: string }
      aurora_ref: { required: true, type: string }

permissions:
  contents: read

concurrency:
  group: aurora-browser-${{ inputs.source_repo }}-${{ inputs.pr_number }}-${{ inputs.scenario_hash }}
  cancel-in-progress: true

jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact customer PR commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.head_sha }}
          path: app
          persist-credentials: false

      - name: Check out pinned Aurora runner
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.aurora_repo }}
          ref: ${{ inputs.aurora_ref }}
          path: aurora
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact commit
        working-directory: app
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install locked browser-runner dependencies from wheels
        working-directory: aurora/server
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r browser_testing/requirements-ci.txt
          python -m playwright install chromium

      - name: Install and start customer app in isolated container
        if: inputs.install_command != '__aurora_lab_kind__'
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          START_COMMAND: ${{ inputs.start_command }}
          PORT: ${{ inputs.preview_port }}
        run: |
          docker run --detach --name aurora-customer-app \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            --publish "127.0.0.1:${PORT}:${PORT}" \
            --volume "$GITHUB_WORKSPACE/app:/workspace/app:ro" \
            --workdir /workspace/app \
            --env PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b \
            sh -lc "$INSTALL_COMMAND && exec $START_COMMAND"

      - name: Verify customer container has no agent credentials
        if: inputs.install_command != '__aurora_lab_kind__'
        run: |
          if docker exec aurora-customer-app env | grep -Eq \
            '^(OPENAI_API_KEY|OPENROUTER_API_KEY|GH_TOKEN|GITHUB_TOKEN|GITHUB_APP_PRIVATE_KEY)='; then
            echo "Customer container received a forbidden credential" >&2
            exit 1
          fi

      - name: Wait for preview
        if: inputs.install_command != '__aurora_lab_kind__'
        env:
          PORT: ${{ inputs.preview_port }}
          PATH_PART: ${{ inputs.readiness_path }}
          TIMEOUT: ${{ inputs.readiness_timeout }}
        run: |
          for ((second=0; second<TIMEOUT; second++)); do
            curl --fail --silent "http://127.0.0.1:${PORT}${PATH_PART}" >/dev/null && exit 0
            sleep 1
          done
          docker logs aurora-customer-app
          exit 1

      - name: Boot exact Aurora Lab PR deployment in kind
        if: inputs.install_command == '__aurora_lab_kind__'
        env:
          MANIFEST_PATH: ${{ inputs.start_command }}
          SCENARIO: ${{ inputs.scenario_path }}
          TIMEOUT: ${{ inputs.readiness_timeout }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_PATH" =~ ^[A-Za-z0-9._/-]+\.ya?ml$ ]]
          manifest="$(realpath --canonicalize-existing "$GITHUB_WORKSPACE/app/$MANIFEST_PATH")"
          [[ "$manifest" == "$GITHUB_WORKSPACE/app/"* ]]

          curl --fail --silent --show-error --location \
            https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  $RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind

          kind create cluster --name aurora-browser --wait 180s
          kubectl apply -f "$GITHUB_WORKSPACE/app/app/shop.yaml"
          kubectl -n shop delete deployment frontend --wait=true
          kubectl apply -f "$manifest"
          kubectl -n shop wait --for=condition=Available deployment --all --timeout="${TIMEOUT}s"

          scenario="$GITHUB_WORKSPACE/aurora/server/browser_testing/fixtures/$SCENARIO"
          target_file="$GITHUB_WORKSPACE/target-urls.json"
          echo '{}' > "$target_file"
          next_port=18081
          while IFS=$'\t' read -r target namespace selector port; do
            mapfile -t pods < <(kubectl -n "$namespace" get pods -l "$selector" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
            [[ "${#pods[@]}" -eq 1 && -n "${pods[0]}" ]] || {
              echo "Target $target selector $selector matched ${#pods[@]} pods; expected exactly one" >&2
              exit 1
            }
            kubectl -n "$namespace" port-forward "pod/${pods[0]}" "$next_port:$port" \
              >"$RUNNER_TEMP/port-forward-$target.log" 2>&1 &
            echo $! >> "$RUNNER_TEMP/port-forward-pids"
            jq --arg id "$target" --arg url "http://127.0.0.1:$next_port/" \
              '. + {($id): $url}' "$target_file" > "$target_file.tmp"
            mv "$target_file.tmp" "$target_file"
            next_port=$((next_port + 1))
          done < <(jq -r '.targets[] | [.id,.namespace,.selector,(.port|tostring)] | @tsv' "$scenario")

          for url in $(jq -r '.[]' "$target_file"); do
            ready=false
            for ((second=0; second<TIMEOUT; second++)); do
              if curl --fail --silent "${url%/}${{ inputs.readiness_path }}" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            [[ "$ready" == true ]] || exit 1
          done

      - name: Collect browser evidence
        id: browser
        continue-on-error: true
        working-directory: aurora/server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PORT: ${{ inputs.preview_port }}
          SCENARIO: ${{ inputs.scenario_path }}
          MODEL: ${{ inputs.model }}
        run: |
          target_args=()
          if [[ -f "$GITHUB_WORKSPACE/target-urls.json" ]]; then
            while IFS=$'\t' read -r target url; do
              target_args+=(--target-url "$target=$url")
            done < <(jq -r 'to_entries[] | [.key,.value] | @tsv' "$GITHUB_WORKSPACE/target-urls.json")
          fi
          python -m browser_testing run \
            --scenario "$SCENARIO" \
            --preview-url "http://127.0.0.1:${PORT}/" \
            --commit "$HEAD_SHA" \
            --model "$MODEL" \
            "${target_args[@]}"

      - name: Ensure a result exists
        if: always()
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          SCENARIO_HASH: ${{ inputs.scenario_hash }}
          EVIDENCE_DIR: ${{ github.workspace }}/aurora/server/browser_testing/artifacts
        run: |
          mkdir -p "$EVIDENCE_DIR"
          if [[ ! -f "$EVIDENCE_DIR/browser-result.json" ]]; then
            jq -n --arg sha "$HEAD_SHA" --arg hash "$SCENARIO_HASH" \
              '{schemaVersion:1,testedCommit:$sha,scenarioHash:$hash,verdict:"inconclusive",reason:"The fresh VM did not complete the browser runner.",checks:[],screenshot:null}' \
              > "$EVIDENCE_DIR/browser-result.json"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-browser-result-${{ inputs.run_id }}
          path: aurora/server/browser_testing/artifacts/
          retention-days: 14

      - name: Return result to Aurora
        if: always()
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_PATH: ${{ github.workspace }}/aurora/server/browser_testing/artifacts/browser-result.json
        run: |
          python - <<'PY'
          import json, os, urllib.request
          with open(os.environ["RESULT_PATH"], encoding="utf-8") as handle:
              result = json.load(handle)
          body = json.dumps({
              "run_id": os.environ["RUN_ID"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_url": os.environ["WORKFLOW_URL"],
              "result": result,
          }).encode()
          request = urllib.request.Request(
              os.environ["CALLBACK_URL"], data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["CALLBACK_TOKEN"], "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Aurora callback returned {response.status}")
          PY

      - name: Set final job status
        if: always()
        env:
          RESULT_PATH: ${{ github.workspace }}/aurora/server/browser_testing/artifacts/browser-result.json
        run: |
          verdict="$(jq -r .verdict "$RESULT_PATH")"
          [[ "$verdict" == "passed" ]] || exit 1

      - name: Stop preview
        if: always()
        run: |
          docker rm --force aurora-customer-app 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/port-forward-pids" ]]; then
            xargs -r kill < "$RUNNER_TEMP/port-forward-pids" 2>/dev/null || true
          fi
          kind delete cluster --name aurora-browser 2>/dev/null || true
