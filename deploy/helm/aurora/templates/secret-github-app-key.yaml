{{- $cfg := .Values.secrets.githubAppKey | default dict }}
{{- if and (not $cfg.existingSecret) $cfg.GITHUB_APP_PRIVATE_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aurora.secretName.githubAppKey" . }}
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_APP_PRIVATE_KEY: {{ $cfg.GITHUB_APP_PRIVATE_KEY | quote }}
{{- end }}
