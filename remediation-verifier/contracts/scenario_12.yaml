# Frozen incident contract for aurora-lab scenario 12.
#
# This file is the verifier input. Every value below traces to a path, a line
# and the commit in `source`. The human-readable table is PROVENANCE.md, the
# frozen choices are DECISIONS.md, the field requirements are schema.json.
#
# Nothing here may be edited to make a run pass. If a value is wrong, the
# source is wrong or the check is wrong; fix that instead.

scenario: 12-two-faults-oom-and-selector
title: >-
  Two faults at once, worker OOM and a frontend Service selecting no pods;
  the alert covers only the worker

source:
  repo: Arvo-AI/aurora-lab
  url: https://github.com/Arvo-AI/aurora-lab
  commit: 4edcd9dfbc48cbd9ca8ea031e429832cf72842d0
  commit_date: "2026-11-06T00:30:13Z"
  read_on: "2026-11-15"
  fork_repo: kpnaranj/aurora
  fork_commit: 12c67cffd45c6b0b8c5da1d2e160a945e2936f49
  files:
    scenario: scenarios/12-two-faults-oom-and-selector/scenario.yaml
    break: scenarios/12-two-faults-oom-and-selector/break.sh
    check: scenarios/12-two-faults-oom-and-selector/check.sh
    runbook: scenarios/12-two-faults-oom-and-selector/README.md
    app: app/shop.yaml

# The only input an agent may see. It is the alert text and nothing else: no
# second fault, no oracle value, no expected fix.
agent_view:
  alert: "KubePodCrashLooping [warning] namespace=shop deployment=worker: Pod shop/worker (container worker) is in waiting state (reason: CrashLoopBackOff)."

# Verifier only. Never serialized into agent_view(), never written to a log or
# a report that an agent reads.
oracle_view:
  observation:
    window_seconds: 60

  baseline:
    expected_faults:
      - worker-oom
      - frontend-selector

  faults:
    worker-oom:
      namespace: shop
      deployment: worker
      container: worker
      selector: app=worker
      checks:
        - id: no_oomkilled_in_window
          type: k8s
          source: scenarios/12-two-faults-oom-and-selector/check.sh#L1
        - id: restart_count_not_increasing
          type: k8s
          source: scenarios/12-two-faults-oom-and-selector/README.md#L202
        - id: processing_evidence
          type: logs
          source: app/shop.yaml#L73
          container: worker
          pattern: "processed batch of {batch_size} items"
          batch_size_source: deploy/worker env BATCH_SIZE
          min_occurrences: 2

    frontend-selector:
      namespace: shop
      service: frontend
      endpoint_slice_selector: kubernetes.io/service-name=frontend
      selector_expected: app=frontend
      checks:
        - id: service_has_endpoints
          type: k8s
          source: scenarios/12-two-faults-oom-and-selector/check.sh#L2
        - id: endpoints_ready
          type: k8s
          source: scenarios/12-two-faults-oom-and-selector/check.sh#L2
        - id: http_expected_response
          type: http
          source: app/shop.yaml#L256-L257
      http_route: http://frontend.shop.svc.cluster.local/api/items
      http_method: GET
      expected_status: 200
      expected_json:
        items:
          - kettle
          - mug
          - teapot
      requests: 3
      request_interval_seconds: 2
      request_timeout_seconds: 5

  accepted_fixes:
    - id: full
      source: scenarios/12-two-faults-oom-and-selector/scenario.yaml#L17-L18, scenarios/12-two-faults-oom-and-selector/README.md#L164-L180
      steps:
        - kubectl -n shop patch svc frontend --type=json -p='[{"op":"remove","path":"/spec/selector/tier"}]'
        - kubectl -n shop set env deploy/worker BATCH_SIZE=500
    - id: p1_raise_limit
      source: scenarios/12-two-faults-oom-and-selector/scenario.yaml#L17-L18, scenarios/12-two-faults-oom-and-selector/README.md#L160, scenarios/12-two-faults-oom-and-selector/README.md#L183
      steps:
        - kubectl -n shop patch svc frontend --type=json -p='[{"op":"remove","path":"/spec/selector/tier"}]'
        - kubectl -n shop set resources deployment/worker --limits=memory=384Mi --requests=memory=64Mi
    - id: partial_worker_only
      source: scenarios/12-two-faults-oom-and-selector/break.sh#L1 inverse
      steps:
        - kubectl -n shop set env deploy/worker BATCH_SIZE=500
    - id: partial_frontend_only
      source: scenarios/12-two-faults-oom-and-selector/break.sh#L2 inverse
      steps:
        - kubectl -n shop patch svc frontend --type=json -p='[{"op":"remove","path":"/spec/selector/tier"}]'
    - id: noop
      source: deliberate absence of remediation
      steps: []

  variants:
    baseline:
      kind: reproduction
      fix: null
    full:
      kind: remediation
      fix: full
    p1_raise_limit:
      kind: remediation
      fix: p1_raise_limit
    partial_worker_only:
      kind: remediation
      fix: partial_worker_only
    partial_frontend_only:
      kind: remediation
      fix: partial_frontend_only
    noop:
      kind: remediation
      fix: noop
