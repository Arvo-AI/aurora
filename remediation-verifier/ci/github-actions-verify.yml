# Template, not an active workflow.
#
# GitHub only runs files under `.github/workflows/`, and adding one there would
# put a path outside `remediation-verifier/` in the pull request. To run it,
# copy this file to `.github/workflows/remediation-verifier.yml` on a separate
# `ci` branch and link the run in the pull request description.
#
# Properties that matter: read-only token, no secrets, every action pinned by
# full SHA, an explicit `ref` so a push to `ci` still checks out the candidate
# branch, and a timeout on the only job.

name: remediation-verifier

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to verify"
        required: true
        default: kpnaranj/remediation-verifier

permissions:
  contents: read

concurrency:
  group: rv-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || 'kpnaranj/remediation-verifier' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: remediation-verifier/pyproject.toml
      - name: Install
        run: pip install -e "./remediation-verifier[dev]"
      - name: Environment report
        run: make -C remediation-verifier doctor
      - name: Lint
        run: make -C remediation-verifier lint
      - name: Type check
        run: make -C remediation-verifier typecheck
      - name: Tests
        run: make -C remediation-verifier test
