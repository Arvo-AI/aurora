id: 05-nginx-config-error
title: Frontend crash loop from an invalid nginx config
alert: "KubePodCrashLooping: a frontend pod in namespace shop is restarting after a config change."
change: "ConfigMap frontend-nginx edited (a directive mistyped) and the frontend restarted to pick it up."
root_cause: >
  The frontend-nginx ConfigMap contains the directive "proxy_conect_timeout"
  (typo of proxy_connect_timeout). nginx refuses to start: "[emerg] unknown
  directive "proxy_conect_timeout" in /etc/nginx/conf.d/default.conf". The
  restart rolled out new pods that crash loop on the bad config. The rolling
  update stops there, so the old pods (started before the edit) keep serving;
  they will fail too the next time they restart.
must_identify:
  - nginx fails to start with an [emerg] unknown directive error
  - The bad directive is proxy_conect_timeout in the frontend-nginx ConfigMap
acceptable_fixes:
  - Correct the directive to proxy_connect_timeout and restart the frontend
  - Restore the previous ConfigMap
wrong_answers:
  - Liveness or readiness probe misconfiguration
  - Resource limits
