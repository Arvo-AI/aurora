name: Publish MinIO Image

# Rebuilds upstream MinIO from its GitHub release binary and publishes it to
# GHCR. MinIO deleted minio/minio from Docker Hub in Sept 2026, so chart
# installs with services.minio.enabled had no pullable image.
#
# Content is immutable (one pinned upstream release), so this does not need to
# run on every push — only when the Dockerfile changes, or on demand.
#
# Two jobs by design:
#   validate — pull_request: builds both arches and boots the binary, no push,
#              no registry credentials. Lets us verify before merge, since a
#              workflow cannot be dispatched until it lands on the default branch.
#   publish  — main / manual: builds, pushes, and gates on package visibility.
on:
  pull_request:
    paths:
      - 'deploy/images/minio/Dockerfile'
      - '.github/workflows/publish-minio-image.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/images/minio/Dockerfile'
      - '.github/workflows/publish-minio-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-minio-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/arvo-ai/aurora-minio
  # Keep in sync with ARG MINIO_RELEASE in deploy/images/minio/Dockerfile and
  # with services.minio.image.tag in the Helm chart values.
  MINIO_RELEASE: RELEASE.2025-04-22T22-12-26Z

jobs:
  validate:
    name: Validate image build (no push)
    if: github.event_name == 'pull_request' && github.repository == 'Arvo-AI/aurora'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No packages:write — this job never touches the registry.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # No QEMU: the fetch stage pins --platform=$BUILDPLATFORM and only
      # downloads, so the arm64 leg builds natively on an amd64 runner.
      - name: Build both arches
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./deploy/images/minio
          file: ./deploy/images/minio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: Load amd64 image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./deploy/images/minio
          file: ./deploy/images/minio/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          tags: aurora-minio:pr-smoke
          cache-from: type=gha,scope=minio

      # A checksum match proves we fetched the right bytes; it does not prove the
      # distroless base or entrypoint actually run them. Boot it and probe the
      # same health paths the chart's probes use.
      - name: Smoke-test the image
        shell: bash
        run: |
          set -euo pipefail

          echo "--- minio --version ---"
          docker run --rm aurora-minio:pr-smoke --version

          echo "--- start server ---"
          docker run -d --name minio-smoke -p 9000:9000 \
            -e MINIO_ROOT_USER=smoketestuser \
            -e MINIO_ROOT_PASSWORD=smoketestsecret \
            aurora-minio:pr-smoke server /data --console-address :9001

          cleanup() { docker rm -f minio-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "live after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::MinIO never became live" >&2
              docker logs minio-smoke >&2 || true
              exit 1
            fi
            sleep 1
          done

          # Same path as the chart's readinessProbe.
          curl -sf http://localhost:9000/minio/health/ready >/dev/null
          echo "readiness path OK"

          echo "--- container logs ---"
          docker logs minio-smoke 2>&1 | tail -20

      - name: Summary
        shell: bash
        run: |
          {
            echo "### aurora-minio build validated"
            echo ""
            echo "- Built \`linux/amd64\` + \`linux/arm64\` (checksums verified in-build)"
            echo "- Booted \`${MINIO_RELEASE}\` and passed the live + ready health probes"
            echo "- Nothing pushed; publish runs on merge to \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish aurora-minio
    if: github.event_name != 'pull_request' && github.repository == 'Arvo-AI/aurora'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./deploy/images/minio
          file: ./deploy/images/minio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance attestations add unknown/unknown entries to the manifest
          # list, which would break the arch verification below.
          provenance: false
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.MINIO_RELEASE }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: Verify manifest covers both architectures
        shell: bash
        run: |
          set -euo pipefail
          REF="${IMAGE_NAME}:${MINIO_RELEASE}"
          docker buildx imagetools inspect "$REF"
          PLATFORMS=$(docker buildx imagetools inspect "$REF" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "Platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            echo "$PLATFORMS" | grep -q "$want" || { echo "Missing $want in manifest list" >&2; exit 1; }
          done

      - name: Report digest to pin in values.yaml
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "No digest produced by build step" >&2
            exit 1
          fi
          {
            echo "### aurora-minio published"
            echo ""
            echo "Release: \`${MINIO_RELEASE}\`"
            echo ""
            echo "Pin it in the chart with:"
            echo ""
            echo '```yaml'
            echo "services:"
            echo "  minio:"
            echo "    image:"
            echo "      digest: \"${DIGEST}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # GHCR packages are private on first publish, and a private aurora-minio
      # reproduces the exact ImagePullBackOff this image exists to fix. Fail
      # loudly. Kept last so the digest above is recorded even when this trips.
      - name: Require the package to be anonymously pullable
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf --proto '=https' --tlsv1.2 "https://ghcr.io/token?service=ghcr.io&scope=repository:arvo-ai/aurora-minio:pull" | jq -r '.token // empty')
          CODE=$(curl -s --proto '=https' --tlsv1.2 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/arvo-ai/aurora-minio/manifests/${MINIO_RELEASE}")
          if [ "$CODE" = "200" ]; then
            echo "Package is public — clients can pull anonymously."
            exit 0
          fi
          echo "::error::aurora-minio is published but NOT anonymously pullable (HTTP ${CODE})."
          {
            echo ""
            echo "### Action required: make the package public"
            echo ""
            echo "The image pushed successfully, but \`aurora-minio\` is private, so"
            echo "\`services.minio.enabled: true\` installs will fail with ImagePullBackOff."
            echo ""
            echo "Fix: **Packages → aurora-minio → Package settings → Change visibility → Public**,"
            echo "then re-run this workflow to confirm."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
