{{- if .Values.services.postgres.enabled }}
{{- /*
Refuse to render when the pods this values file describes can open more
Postgres connections than the in-cluster Postgres allows: a helm error now
instead of "FATAL: sorry, too many clients already" at the next alert burst.
Mirrors the budget documented at services.postgres.maxConnections in values.yaml.
*/}}
{{- $cfg := .Values.config }}
{{- $workers := default "2" $cfg.GUNICORN_WORKERS | int }}
{{- $pool := default "20" $cfg.DB_POOL_MAX | int }}
{{- $concurrency := default "4" $cfg.CELERY_CONCURRENCY | int }}
{{- $serverPods := ternary .Values.autoscaling.server.maxReplicas .Values.replicaCounts.server (eq (toString .Values.autoscaling.server.enabled) "true") | int }}
{{- $workerPods := ternary .Values.autoscaling.celeryWorker.maxReplicas .Values.replicaCounts.celeryWorker (eq (toString .Values.autoscaling.celeryWorker.enabled) "true") | int }}
{{- $chatbotPods := .Values.replicaCounts.chatbot | int }}
{{- $beatPods := .Values.replicaCounts.celeryBeat | int }}
{{- $mcpPods := .Values.replicaCounts.mcp | int }}
{{- $budget := add (mul $serverPods $workers (add $pool 15)) (mul $workerPods $concurrency $pool) (mul $chatbotPods $pool) (mul $beatPods $pool) (mul $mcpPods 10) }}
{{- $limit := 100 }}
{{- $managedElsewhere := false }}
{{- with .Values.services.postgres.maxConnections }}{{ $limit = int . }}{{ end }}
{{- range .Values.services.postgres.extraArgs }}{{ if contains "max_connections=" (toString .) }}{{ $managedElsewhere = true }}{{ end }}{{ end }}
{{- if and (not $managedElsewhere) (gt $budget $limit) }}
{{- fail (printf "Postgres connection budget: the configured pods can open up to %d connections (server %d x GUNICORN_WORKERS %d x (DB_POOL_MAX %d + 15) + celery-worker %d x CELERY_CONCURRENCY %d x %d + chatbot %d x %d + celery-beat %d x %d + mcp %d x 10) but the in-cluster Postgres allows %d. Raise services.postgres.maxConnections (and resources.postgres.limits.memory, about 10Mi per connection) or lower the replica counts, autoscaling maxReplicas or config.DB_POOL_MAX." $budget $serverPods $workers $pool $workerPods $concurrency $pool $chatbotPods $pool $beatPods $pool $mcpPods $limit) }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aurora.fullname" . }}-postgres
  labels:
    {{- include "aurora.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aurora.fullname" . }}-postgres
  replicas: {{ .Values.replicaCounts.postgres }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aurora.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.db.existingSecret }}
        checksum/secret-db: {{ include (print $.Template.BasePath "/secret-db.yaml") . | sha256sum }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "aurora.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: aurora
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "aurora.podSecurityContext" (dict "service" "postgres" "global" $ "defaults" (dict "runAsUser" 70 "runAsGroup" 70 "fsGroup" 70)) | nindent 8 }}
      {{- include "aurora.scheduling" (dict "service" "postgres" "global" $) | nindent 6 }}
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          {{- if or .Values.services.postgres.maxConnections .Values.services.postgres.extraArgs }}
          # Command-line settings override postgresql.conf; the image entrypoint
          # prepends "postgres" when the first arg starts with "-".
          args:
            {{- with .Values.services.postgres.maxConnections }}
            - "-c"
            - "max_connections={{ . }}"
            {{- end }}
            {{- range .Values.services.postgres.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- include "aurora.containerSecurityContext" (dict "service" "postgres" "global" $ "defaults" (dict)) | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: {{ include "aurora.fullname" . }}-config
            - secretRef:
                name: {{ include "aurora.secretName.db" . }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.postgres.size }}
{{- end }}
